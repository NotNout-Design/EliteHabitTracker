<style>
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;--round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
--bg:#050505;--s1:#121212;--s2:#1b1b1b;--s3:#2a2a2c;--sheet:#0b0b0b;--bd:rgba(255,255,255,.06);--t1:#f5f5f7;--t2:rgba(235,235,245,.62);--t3:rgba(235,235,245,.34);--ac:#9f85ff;--aci:#fff;--good:#3ccf86;--goodi:#111;--bad:#ff5f6d;--badi:#fff;--tab:rgba(48,48,52,.78);
--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.35,.5,1);--sheet-ease:cubic-bezier(.32,.72,0,1);--cs:24px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{position:fixed;inset:0;font-size:16px;line-height:1.35;transition:background .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;color:inherit;font-size:16px;background:none;border:0;outline:none}
input::placeholder,textarea::placeholder{color:var(--t3)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.fl{fill:var(--ac);stroke:var(--ac);stroke-width:1}
.hscroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.hscroll::-webkit-scrollbar{display:none}
#app{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(var(--sat) + 8px) 16px calc(var(--sab) + 118px);display:none}
.view.active{display:block;animation:viewIn .34s var(--ease)}
#v-cal{padding:0;overflow:hidden}#v-cal.active{display:flex;flex-direction:column}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap{max-width:680px;margin:0 auto;position:relative}.wrap.wide{max-width:1080px}
.no-sel,.card,.dr-item,.blk,.c,.wd,.pill,.tab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* dock */
#dock{position:fixed;left:0;right:0;bottom:max(10px,calc(var(--sab) - 6px));display:flex;justify-content:center;align-items:center;gap:10px;padding:0 14px;z-index:50;pointer-events:none}
.tabbar{pointer-events:auto;flex:1;max-width:420px;height:66px;border-radius:33px;background:var(--tab);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);display:flex;align-items:center;justify-content:space-between;padding:6px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 0 0 .5px rgba(255,255,255,.08)}
.tab{position:relative;z-index:1;flex:1;height:54px;border-radius:27px;display:grid;place-items:center;color:var(--t2);transition:color .25s}
.tab .ic{width:27px;height:27px;stroke-width:1.7;transition:transform .35s var(--spring)}
.tab.on{color:var(--t1)}.tab:active .ic{transform:scale(.86)}
.tab-ind{position:absolute;left:0;top:6px;height:54px;border-radius:27px;background:var(--bg);opacity:.9;transition:transform .45s var(--spring),width .3s var(--ease);will-change:transform}

.fab{pointer-events:auto;width:66px;height:66px;border-radius:50%;background:var(--ac);color:var(--aci);display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.3),0 0 0 6px var(--tab);flex:none;transition:transform .2s}
.fab .ic{width:30px;height:30px;stroke-width:2.2}.fab:active{transform:scale(.92)}
/* common */
.pg-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 2px 14px;min-height:52px}
.pg-t{font-family:var(--serif);font-size:36px;font-weight:600;letter-spacing:-.4px}
.round-btn{height:46px;min-width:46px;padding:0 14px;border-radius:23px;background:var(--s2);display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,background .2s}
.round-btn.txt{font-weight:600;font-size:15px;padding:0 16px}.round-btn:active{transform:scale(.93)}
.round-btn.on{background:var(--ac);color:var(--aci)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:25px;background:var(--s2);font-weight:600;font-size:16px;transition:transform .15s,opacity .2s}
.btn .ic{width:20px;height:20px}.btn:active{transform:scale(.96)}
.btn.primary{background:var(--ac);color:var(--aci)}.btn.danger{color:var(--bad)}.btn.wide{width:100%;margin-top:14px}
.danger-t{color:var(--bad)!important}
.lbl{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--t3);margin:22px 6px 8px}
.lbl-s{text-transform:none;letter-spacing:0;font-weight:400;display:block;margin-top:2px}
.group{background:var(--s1);border-radius:22px;overflow:hidden;border:1px solid var(--bd)}
.group.pad{padding:14px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:8px 16px;width:100%;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--bd)}
.row .rl{font-size:17px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.row .rl small{font-size:13px;color:var(--t3)}
.row.nav .rl{flex-direction:row;align-items:center;gap:12px}
.ri{width:30px;height:30px;border-radius:9px;background:var(--s2);display:grid;place-items:center;color:var(--t2)}.ri .ic{width:18px;height:18px}
.rv{display:flex;align-items:center;gap:6px;color:var(--t2);font-size:15px;text-align:right;min-width:0}.rv>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.rc{width:18px;height:18px;color:var(--t3)}
.row.center{justify-content:center;font-weight:600}
.row:active:not(div){background:var(--s2)}
.rpill{position:relative;height:44px;padding:0 16px;border-radius:22px;background:var(--s2);display:inline-flex;align-items:center;gap:8px;font-size:16px;white-space:nowrap;max-width:62%;overflow:hidden}
.rpill .ic{width:19px;height:19px;color:var(--t2)}.rpill .e{font-size:18px}
.ghost-in{position:absolute;inset:0;opacity:0;width:100%;height:100%;-webkit-appearance:none;appearance:none;cursor:pointer}
.ghost-in::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:0;cursor:pointer}
.switch{width:52px;height:32px;border-radius:16px;background:var(--s3);position:relative;flex:none;transition:background .25s}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .32s var(--spring)}
.switch.on{background:var(--good)}.switch.on i{transform:translateX(20px)}
.seg{display:inline-flex;background:var(--s2);border-radius:20px;padding:3px;gap:2px;position:relative}
.seg.full{display:flex;width:100%}.seg.full .seg-b{flex:1}
.seg-b{height:36px;padding:0 14px;border-radius:17px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;color:var(--t2);transition:background .25s,color .25s,transform .15s;white-space:nowrap}
.seg-b .ic{width:17px;height:17px}.seg-b.on{background:var(--s1);color:var(--t1);box-shadow:0 1px 4px rgba(0,0,0,.18)}
html:not(.light) .seg-b.on{background:var(--s3)}
.seg.sm .seg-b{height:32px;padding:0 11px;font-size:13px}.seg.xs .seg-b{height:28px;padding:0 10px;font-size:12px}
.seg-b:active{transform:scale(.95)}
.empty{text-align:center;padding:56px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty.sm{padding:30px 10px}
.em-e{font-size:46px;margin-bottom:6px;animation:floaty 3s ease-in-out infinite}
.em-t{font-family:var(--serif);font-size:22px;font-weight:600}.em-s{color:var(--t2);font-size:15px;max-width:300px;margin-bottom:12px}
@keyframes floaty{50%{transform:translateY(-6px)}}
.ec{width:46px;height:46px;border-radius:50%;background:var(--hc,var(--s3));display:grid;place-items:center;font-size:24px;flex:none;line-height:1}
.ec.sm{width:38px;height:38px;font-size:20px}.ec.xs{width:30px;height:30px;font-size:16px}.ec.xl{width:64px;height:64px;font-size:34px}
.ec.big{width:56px;height:56px;font-size:30px;transition:transform .2s}.ec.big:active{transform:scale(.9)}
.tile{flex:1;background:var(--s2);border-radius:18px;padding:12px;text-align:center;min-width:0}
.tile .tv{font-family:var(--round);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.tile .tv .ic{width:19px;height:19px}.tile .tl{font-size:12px;color:var(--t2);margin-top:2px}
.tx-hint{font-size:13px;color:var(--t2);margin-top:10px;line-height:1.45}.tx-hint.pad{padding:0 8px}
.tx-hint b.g{color:var(--good)}.tx-hint b.b{color:var(--bad)}
.banner{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:12px 12px 12px 16px;margin:6px 0 4px;font-size:14px;color:var(--t2);transition:opacity .3s,transform .3s}
.banner span{flex:1;display:flex;align-items:center;gap:8px}.banner .ic{width:18px;height:18px}
.banner.gone{opacity:0;transform:scale(.96)}
.banner.demo{background:var(--acs);color:var(--t1);border-color:transparent}
.banner.welcome{flex-direction:column;align-items:flex-start;padding:16px}
.wl-t{font-weight:700;color:var(--t1);font-size:16px}.wl-s{line-height:1.45}
.bn-b{height:34px;padding:0 14px;border-radius:17px;background:var(--ac);color:var(--aci);font-weight:600;font-size:14px;flex:none}
.bn-x{width:30px;height:30px;display:grid;place-items:center;color:var(--t3)}.bn-x .ic{width:16px;height:16px}
/* TODAY */
.sticky-h{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(var(--sat) + 8px) 0 10px;text-align:center;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--bd);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s,transform .25s}
.sticky-h.show{opacity:1;transform:none}
.st-day{font-family:var(--serif);font-size:22px;font-weight:600}.st-date{font-size:14px;color:var(--t2);letter-spacing:.4px}
.t-top{display:flex;align-items:center;justify-content:space-between;height:52px}
.chips{display:flex;gap:16px;align-items:center}
.chip{display:flex;align-items:center;gap:7px;font-family:var(--round);font-size:18px;font-weight:600;height:40px}
.chip .fl{width:24px;height:24px}
.mini-ring{display:grid;place-items:center}.mini-ring .ring-p{transition:stroke-dashoffset .6s var(--ease)}
.t-actions{display:flex;gap:8px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;margin:12px 2px 0;gap:10px}
.day-title{font-family:var(--serif);font-size:44px;font-weight:600;letter-spacing:-.6px;line-height:1.05}
.day-title.sm{font-size:30px}
.month-btn{font-size:15px;letter-spacing:1.6px;font-weight:500;display:flex;align-items:center;gap:2px;padding:8px 0 6px;white-space:nowrap}.month-btn .ic{width:20px;height:20px}
.hijri{font-size:13px;color:var(--t3);margin:6px 3px 0;letter-spacing:.2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:16px -8px 10px;touch-action:pan-y}
.week.in-r{animation:inR .32s var(--ease)}.week.in-l{animation:inL .32s var(--ease)}
.wd{display:flex;flex-direction:column;align-items:center;padding:10px 0 10px;border-radius:22px;transition:background .25s,transform .15s}
.wd:active{transform:scale(.94)}
.wd .l{font-size:12px;font-weight:600;color:var(--t2)}
.wd .n{font-size:27px;font-family:var(--round);font-weight:400;margin-top:1px;color:var(--t2);line-height:1.15}
.wd.sel{background:var(--s2)}.wd.sel .n,.wd.sel .l{color:var(--t1)}
.wd.today:not(.sel) .n{color:var(--ac);font-weight:600}
.wd .bar{width:52%;height:4px;border-radius:2px;background:var(--s3);margin-top:7px;overflow:hidden;opacity:.8}
.wd .bar i{display:block;height:100%;background:var(--ac);transform-origin:left;transition:transform .5s var(--ease)}
.wd.sel .bar{background:color-mix(in srgb,var(--t1) 22%,transparent)}.wd.sel .bar i{background:var(--t1)}
.wd.full .bar i{background:var(--good)}
.secs.in-r{animation:inR .34s var(--ease)}.secs.in-l{animation:inL .34s var(--ease)}.secs.in-up{animation:viewIn .4s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.secs{touch-action:pan-y;min-height:50vh}
.secs.future .chk,.secs.future .cntb{opacity:.35}
.sec{margin-top:20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px 0 17px;border-radius:23px;background:var(--pc);color:var(--pi);font-size:15px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;position:relative;overflow:hidden;transition:transform .15s}
.pill:active{transform:scale(.96)}.pill .ic{width:22px;height:22px;stroke-width:1.6}
.pill .chev{width:20px;height:20px;transition:transform .35s var(--spring);margin-left:2px}
.sec.collapsed .chev{transform:rotate(-90deg)}
.sec-n{letter-spacing:1px}
.pill.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:shine .9s var(--ease)}
@keyframes shine{to{transform:translateX(100%)}}
.sec.complete .pill .pl::after{content:" ✓";letter-spacing:0}
.sec-add{width:34px;height:34px;border-radius:50%;background:var(--s2);color:var(--t2);display:grid;place-items:center;transition:transform .15s}
.sec-add .ic{width:20px;height:20px}.sec-add:active{transform:scale(.88)}
.sec-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .38s var(--ease),opacity .3s}
.sec.collapsed .sec-body,.gsec.collapsed .sec-body,.hgrp.collapsed .sec-body{grid-template-rows:0fr;opacity:0}
.sec-clip{overflow:hidden;min-height:0}
.sec-list{display:flex;flex-direction:column;gap:10px;padding-bottom:2px}
.all-done{text-align:center;color:var(--t3);font-size:14px;padding:10px}
.card{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 14px;border-radius:26px;background:var(--s1);border:1px solid var(--bd);min-height:80px;position:relative;transition:transform .18s var(--ease),opacity .3s,background .3s}
.card:active{transform:scale(.982)}
.card .ec{width:50px;height:50px;font-size:26px;transition:transform .3s var(--spring)}
.cb{flex:1;min-width:0}
.ct{font-family:var(--round);font-size:19px;font-weight:600;line-height:1.22;overflow-wrap:anywhere;transition:color .3s}
.cs{font-size:16px;color:var(--t2);margin-top:3px;font-family:var(--round);display:flex;align-items:center;flex-wrap:wrap;gap:0 2px}
.cs .dot{margin:0 5px;opacity:.6}.cs .nt{width:15px;height:15px}
.cs .cnt{color:var(--t1);font-weight:600}.cs .cnt.over{color:var(--good)}
.cs .sk{display:inline-flex;align-items:center;gap:4px}.cs .sk .ic{width:15px;height:15px}
.cs .run{display:inline-flex;align-items:center;gap:6px;color:var(--ac);font-weight:600;font-variant-numeric:tabular-nums}
.cs .run i{width:7px;height:7px;border-radius:50%;background:var(--ac);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.card.done .ct{color:var(--t2)}
.card.done .ec{transform:scale(.92)}
.card.skip{opacity:.55}
.chk{width:48px;height:48px;flex:none;display:grid;place-items:center;margin-right:-4px}
.chk svg{width:34px;height:34px;overflow:visible}
.c-o{fill:transparent;stroke:var(--t1);stroke-width:2.4;transition:fill .28s,stroke .28s}
.c-k{fill:none;stroke:var(--hi);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s .06s var(--ease)}
.card.done .c-o{fill:var(--hk);stroke:var(--hk)}.card.done .c-k{stroke-dashoffset:0}
.card.skip .c-o{stroke-dasharray:3 4.2;stroke:var(--t3)}
html.light .c-o{stroke:var(--t2)}
.cntb{width:50px;height:50px;flex:none;position:relative;display:grid;place-items:center;margin-right:-4px}
.cntb .ring{position:absolute;inset:4px}.cntb .ring-p{transition:stroke-dashoffset .45s var(--ease)}
.cntb .cbg{position:absolute;inset:8px;border-radius:50%;background:var(--hk);transform:scale(0);transition:transform .35s var(--spring)}
.cntb .cv{position:relative;font-family:var(--round);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.cntb .cv .ic{width:18px;height:18px}
.card.done .cntb .cbg{transform:scale(1)}.card.done .cntb .cv{color:var(--hi)}
.ovr{position:absolute;top:-2px;right:-4px;background:var(--good);color:var(--goodi);font-size:11px;font-weight:800;border-radius:9px;padding:1px 5px;font-family:var(--round)}
.tmb.running .ring{animation:spinp 2.4s linear infinite}
@keyframes spinp{50%{opacity:.55}}
.card.ph{background:transparent;border:2px dashed var(--s3)}.card.ph>*{opacity:0}
.ghost-card{position:fixed;left:0;top:0;z-index:300;pointer-events:none;box-shadow:0 18px 40px rgba(0,0,0,.4);margin:0;transition:none}
/* celebrations / fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
#fx .pt{position:absolute;border-radius:50%}
#fx .cf{position:absolute;width:8px;height:12px;border-radius:2px}
.cele{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);opacity:0;text-align:center;background:var(--s1);border:1px solid var(--bd);border-radius:30px;padding:26px 34px;box-shadow:0 24px 60px rgba(0,0,0,.4);transition:transform .45s var(--spring),opacity .3s}
.cele.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.cele-e{font-size:52px}.cele-t{font-family:var(--serif);font-size:28px;font-weight:700;margin-top:4px}.cele-s{color:var(--t2);font-size:14px;margin-top:4px}
/* SHEETS */
.sheet-wrap{position:fixed;inset:0;z-index:100}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .4s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - var(--sat) - 18px);background:var(--sheet);border-radius:30px 30px 0 0;transform:translateY(105%);transition:transform .5s var(--sheet-ease);display:flex;flex-direction:column;padding-bottom:var(--sab);will-change:transform;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.full{height:calc(100% - var(--sat) - 18px)}
.open .sheet-bg{opacity:1}.open .sheet{transform:none}
.grab{display:flex;justify-content:center;padding:8px 0 0}.grab i{width:38px;height:5px;border-radius:3px;background:var(--s3)}
.sheet-head{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;padding:4px 14px 6px;min-height:58px}
.sh-t{text-align:center;font-weight:700;font-size:18px}
.sh-r{display:flex;justify-content:flex-end}

}
/* habit sheet */
.title-box{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--bd);border-radius:26px;padding:10px 10px 10px 22px;margin-bottom:14px}

.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease),opacity .3s;opacity:0}

.unit-in{background:var(--s2);border-radius:16px;height:44px;padding:0 14px;width:150px;text-align:right}

.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:10px}
.sw{aspect-ratio:1;border-radius:50%;background:var(--c);position:relative;transition:transform .2s var(--spring);box-shadow:inset 0 0 0 1px rgba(128,128,128,.25)}
.sw.on{box-shadow:0 0 0 2.5px var(--sheet),0 0 0 4.5px var(--t1)}.sw:active{transform:scale(.85)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.dc{flex:1;min-width:40px;height:44px;border-radius:16px;background:var(--s1);border:1px solid var(--bd);font-weight:600;font-size:14px;color:var(--t2);transition:all .2s}
.dc.on{background:var(--ac);color:var(--aci);border-color:transparent}
.row.radio .rk{opacity:0;color:var(--ac);transition:opacity .2s}.row.radio.on .rk{opacity:1}
.emoji-pick .ep-type{background:var(--s1);border-radius:18px;padding:0 16px;height:50px;display:flex;align-items:center;margin-bottom:12px;border:1px solid var(--bd)}
.ep-in{flex:1}.ep-tabs{display:flex;gap:6px;margin-bottom:10px}
.ep-tabs .seg-b{background:var(--s1)}.ep-tabs .seg-b.on{background:var(--ac);color:var(--aci)}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:4px}
.ep-e{font-size:30px;height:52px;border-radius:14px;display:grid;place-items:center;transition:transform .15s}
.ep-e:active{transform:scale(.8)}.ep-e.on{background:var(--s2)}
/* day sheet */
.ds-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ds-h{min-width:0}.ds-t{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.15}
.ds-s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--t2)}

.big-check{width:100%;height:64px;border-radius:24px;background:var(--s1);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;gap:12px;font-size:18px;font-weight:700;transition:background .3s,color .3s,transform .15s;margin:10px 0}
.big-check .bc-i{width:34px;height:34px;border-radius:50%;border:2.4px solid var(--t2);display:grid;place-items:center;transition:all .3s}

.bc-b{width:62px;height:62px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-weight:700;font-family:var(--round);font-size:17px;transition:transform .15s}

.bc-mid{display:flex;flex-direction:column;align-items:center}
.bc-ring{position:relative;width:132px;height:132px}.bc-ring .ring{position:absolute;inset:0}.bc-ring .ring-p{transition:stroke-dashoffset .5s var(--ease)}

.ds-acts{display:flex;gap:8px;margin:10px 0}

.ds-stats{display:flex;gap:8px;margin-top:14px}
.mini-row{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.mq{aspect-ratio:1;border-radius:6px;background:var(--s2)}
.mq.done{background:var(--hk)}.mq.part{background:color-mix(in srgb,var(--hk) 45%,var(--s2))}.mq.skip{background:repeating-linear-gradient(45deg,var(--s3) 0 2px,transparent 2px 5px)}
.mq.x{background:transparent;border:1px dashed var(--s3)}.mq.cur{outline:2px solid var(--t1);outline-offset:1px}
.ds-btns{display:flex;gap:10px;margin-top:18px}.ds-btns .btn{flex:1}
/* menus */
.menu-wrap{position:fixed;inset:0;z-index:250}
.menu-bg{position:absolute;inset:0}
.menu{position:absolute;background:color-mix(in srgb,var(--s2) 92%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border-radius:18px;padding:6px;box-shadow:0 16px 50px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.08);transform:scale(.8);opacity:0;transition:transform .32s var(--spring),opacity .18s;max-height:70vh;overflow-y:auto}

.menu-title{font-size:12px;font-weight:600;color:var(--t3);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.5px}

.menu-item:active{background:var(--s3)}.menu-item .ic{width:19px;height:19px;color:var(--t2)}
.menu-item.danger,.menu-item.danger .ic{color:var(--bad)}.mi-l{display:flex;align-items:center;gap:10px;min-width:0}
.mi-e{font-size:18px}.mi-sw{width:16px;height:16px;border-radius:50%}.mi-ck{color:var(--ac)!important}
.menu-sep{height:1px;background:var(--bd);margin:4px 8px}
/* alert */

.alert{width:min(320px,100%);background:var(--s1);border-radius:26px;padding:22px 20px 16px;text-align:center;transform:scale(1.1);transition:transform .3s var(--spring)}

/* toast */
#toast-root{position:fixed;left:0;right:0;bottom:calc(max(10px,var(--sab) - 6px) + 80px);display:flex;justify-content:center;z-index:350;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--s2) 94%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:22px;padding:12px 12px 12px 18px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(20px) scale(.96);opacity:0;transition:transform .4s var(--spring),opacity .25s;max-width:440px}

.toast.show{transform:none;opacity:1}
.toast button{background:var(--ac);color:var(--aci);height:32px;padding:0 14px;border-radius:16px;font-weight:700;font-size:14px;flex:none}
/* month sheet */
.mo-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mo-t{font-family:var(--serif);font-size:22px;font-weight:600}

.mo-d.today span{color:var(--ac)}.mo-d.sel{outline:2.5px solid var(--t1);outline-offset:1px}
/* CALENDAR */
.cal-head{flex:none;padding:calc(var(--sat) + 8px) 16px 0;background:var(--bg);z-index:3;position:relative}
.ch-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:8px}

.ch-acts{display:flex;gap:8px}
.drawer-btn b{font-family:var(--round);font-size:14px;min-width:20px;height:20px;border-radius:10px;background:var(--ac);color:var(--aci);display:grid;place-items:center;padding:0 5px}
.drawer-btn.on b{background:var(--aci);color:var(--ac)}
#c-week{margin-bottom:6px}
.cal-main{flex:1;min-height:0;display:flex;position:relative;border-top:1px solid var(--bd)}
.tl-scroll{flex:1;overflow-y:auto;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sab) + 110px)}
.tl{position:relative;margin:12px 0}
.tl-hours{position:absolute;inset:0;pointer-events:none}
.hr{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--bd)}
.hr span{position:absolute;left:8px;top:-8px;font-size:11px;color:var(--t3);background:var(--bg);padding-right:6px;font-variant-numeric:tabular-nums;width:50px}
.tl-bands{position:absolute;inset:0 0 0 58px;pointer-events:none}
.band{position:absolute;left:0;right:0}
.band.morning{background:color-mix(in srgb,var(--pMor) 10%,transparent)}.band.afternoon{background:color-mix(in srgb,var(--pAft) 16%,transparent)}.band.evening{background:color-mix(in srgb,var(--pEve) 26%,transparent)}
.band.night,.band.night2{background:color-mix(in srgb,var(--s1) 50%,transparent)}
.band-l{position:sticky;top:4px;display:inline-flex;align-items:center;gap:5px;margin:6px 0 0 8px;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--t3)}
.band-l .ic{width:14px;height:14px}
.tl-cols{position:absolute;top:0;bottom:0;left:58px;right:8px;display:grid}
.tl-col{position:relative;border-left:1px solid var(--bd)}
.tl-col.is-today{background:color-mix(in srgb,var(--ac) 3%,transparent)}
.now{position:absolute;left:calc(58px + (100% - 66px) / var(--cn,1) * var(--ci,0));width:calc((100% - 66px) / var(--cn,1));height:2px;background:var(--bad);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.blk{position:absolute;border-radius:12px;background:var(--hbg);border-left:3.5px solid var(--hc);z-index:2;transition:box-shadow .2s,opacity .2s;cursor:pointer;backdrop-filter:none}

.be{font-size:16px;line-height:1.2}
.bt{min-width:0;flex:1}.btt{font-size:13.5px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bts{font-size:11.5px;color:var(--t2);margin-top:1px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px;white-space:nowrap}.bts .bk{width:11px;height:11px}
.blk.short .blk-in{align-items:center;padding:2px 8px}.blk.short .bt{display:flex;align-items:baseline;gap:6px}.blk.short .btt{-webkit-line-clamp:1;white-space:nowrap;display:block}.blk.short .bts{margin:0}.blk.short .be{font-size:14px}
.blk.done{opacity:.55}.blk.done .btt{text-decoration:line-through}
.bd{width:20px;height:20px;border-radius:50%;background:var(--hc);color:var(--hi,#fff);display:grid;place-items:center;flex:none}.bd .ic{width:13px;height:13px;stroke-width:2.6;color:#111}
.blk.e{border-left-style:solid;background:repeating-linear-gradient(135deg,var(--hbg) 0 10px,color-mix(in srgb,var(--hbg) 70%,transparent) 10px 20px)}
.rz{position:absolute;left:18%;right:18%;bottom:-9px;height:20px;z-index:3;cursor:ns-resize;touch-action:none;display:flex;justify-content:center;align-items:flex-start;padding-top:6px}
.rz i{width:26px;height:4px;border-radius:2px;background:var(--hc);opacity:0;transition:opacity .2s}
.blk:hover .rz i,.blk.resizing .rz i{opacity:.9}
@media (pointer:coarse){.rz i{opacity:.55}}
.blk.ph{opacity:.25}
.blk.resizing{box-shadow:0 0 0 2px var(--hc);z-index:5}
.ghost-blk{position:fixed!important;left:0;top:0;z-index:320;pointer-events:none;box-shadow:0 16px 40px rgba(0,0,0,.45);opacity:.96;border-radius:12px;transition:opacity .15s}
.ghost-blk.nogo{opacity:.5}
.drop-prev{position:absolute;left:2px;right:2px;border:2px dashed var(--ac);border-radius:12px;background:var(--acs);z-index:3;display:flex;align-items:flex-start;padding:4px 8px;font-size:12px;font-weight:700;color:var(--t1);pointer-events:none;font-variant-numeric:tabular-nums}
.drawer{position:absolute;top:0;bottom:0;right:0;width:min(86vw,340px);background:var(--s1);border-left:1px solid var(--bd);transform:translateX(102%);transition:transform .45s var(--sheet-ease),opacity .3s;z-index:6;display:flex;flex-direction:column;box-shadow:-20px 0 40px rgba(0,0,0,.25);padding:12px 12px calc(var(--sab) + 96px)}
.drawer.open{transform:none}.drawer.open.peek{transform:translateX(102%)}
.dr-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dr-t{font-family:var(--serif);font-size:21px;font-weight:600;display:flex;align-items:center;gap:8px}
.dr-n{font-family:var(--round);font-size:14px;background:var(--ac);color:var(--aci);border-radius:10px;padding:1px 8px}
.dr-list{flex:1;overflow-y:auto;margin-top:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.dr-g{margin-bottom:14px}
.dr-gh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin:0 4px 8px}

.dr-item{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:18px;background:var(--s2);margin-bottom:6px;cursor:grab;transition:transform .2s,opacity .2s}
.dr-item:active{transform:scale(.97)}.dr-item.lifted{opacity:.35}
.di-t{flex:1;min-width:0}.di-n{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.di-s{font-size:12.5px;color:var(--t2)}

.dr-empty{text-align:center;color:var(--t2);font-size:14px;padding:30px 10px}

.unsched-zone.show{opacity:1;transform:translate(-50%,0)}.unsched-zone.hot{background:var(--ac);color:var(--aci);border-color:transparent;transform:translate(-50%,0) scale(1.06)}
.unsched-zone .ic{width:18px;height:18px}

}
/* GRID */

.legend span{display:inline-flex;align-items:center;gap:6px}

.gsec{margin-bottom:14px}

<script>
const APP_VERSION='1.1.0';
'use strict';
/* ================= Utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad = n => String(n).padStart(2, '0');
const raf = cb => requestAnimationFrame(cb);

const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)');
const motionOK = () => !(App.state && App.state.settings.reduceMotion) && !prefersReduced.matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- dates (keys are local YYYY-MM-DD) ---------- */
const DAYS3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYSF = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONF = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const K = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const P = k => { const a = k.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); };
const addD = (k, n) => { const d = P(k); d.setDate(d.getDate() + n); return K(d); };
const wdOf = k => P(k).getDay();
const dDiff = (a, b) => Math.round((P(b) - P(a)) / 864e5);
function todayK() { const r = App.state ? (App.state.settings.resetHour || 0) : 0; return K(new Date(Date.now() - r * 36e5)); }
function weekStartK(k) { const ws = App.state.settings.weekStart; const off = (wdOf(k) - ws + 7) % 7; return addD(k, -off); }
function weekOrder() { const ws = App.state.settings.weekStart; return [0, 1, 2, 3, 4, 5, 6].map(i => (ws + i) % 7); }
const hmToMin = s => { if (!s) return 0; const a = s.split(':'); return (+a[0]) * 60 + (+a[1]); };
const minToHM = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
function fmtTime(min, short) {
  min = ((min % 1440) + 1440) % 1440;
  const hh = Math.floor(min / 60), mm = min % 60;
  if (App.state.settings.clock24) return pad(hh) + ':' + pad(mm);
  const ap = hh < 12 ? 'AM' : 'PM', h12 = hh % 12 || 12;
  return h12 + (mm || !short ? ':' + pad(mm) : '') + (short ? (hh < 12 ? 'a' : 'p') : ' ' + ap);
}
function fmtHour(hh) { if (App.state.settings.clock24) return pad(hh % 24) + ':00'; const h12 = hh % 12 || 12; return h12 + ' ' + (hh % 24 < 12 ? 'AM' : 'PM'); }

  if (d === 0) return 'Today'; if (d === -1) return 'Yesterday'; if (d === 1) return 'Tomorrow';

}
function longDate(k) { const x = P(k); return MONF[x.getMonth()] + ' ' + x.getDate() + ordSuf(x.getDate()); }
function shortDate(k) { const x = P(k); return MON3[x.getMonth()] + ' ' + x.getDate(); }
function ordSuf(n) { const v = n % 100; if (v >= 11 && v <= 13) return 'th'; return ['th', 'st', 'nd', 'rd'][n % 10] || 'th'; }

/* ---------- Hijri ---------- */
const HIJRI_M = ['Muharram', 'Safar', 'Rabi al-Awwal', 'Rabi al-Thani', 'Jumada al-Ula', 'Jumada al-Akhirah', 'Rajab', "Sha'ban", 'Ramadan', 'Shawwal', "Dhul Qa'dah", 'Dhul Hijjah'];
let _hijriFmt = null;
function hijri(k) {
  const d = P(k); d.setDate(d.getDate() + (App.state.settings.hijriOffset || 0));
  try {
    if (_hijriFmt === null) {
      _hijriFmt = false;
      for (const cal of ['islamic-umalqura', 'islamic-civil', 'islamic']) {
        const f = new Intl.DateTimeFormat('en-u-ca-' + cal + '-nu-latn', { day: 'numeric', month: 'numeric', year: 'numeric' });

      }

      const p = {}; _hijriFmt.formatToParts(d).forEach(x => p[x.type] = x.value);

    }

  let day = d.getDate(), month = d.getMonth(), year = d.getFullYear();
  let m = month + 1, y = year; if (m < 3) { y -= 1; m += 12; }

  let im = Math.floor((z + 28.5001) / 29.5); if (im === 13) im = 12; const id = z - Math.floor(29.5001 * im - 29);

}

/* ---------- colors ---------- */
function hexToRgb(hex) { let x = (hex || '#888888').replace('#', ''); if (x.length === 3) x = x.split('').map(c => c + c).join(''); const n = parseInt(x.slice(0, 6), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

function rgba(hex, a) { const c = hexToRgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

/* ---------- haptics (Android vibrate / iOS 18 switch trick) ---------- */
function haptic() {
  if (!App.state || !App.state.settings.haptics) return;
  if (window.SF && SF.haptic) { if (isTouch) SF.haptic(); return; }
  try {
    if (navigator.vibrate && /android/i.test(navigator.userAgent)) { navigator.vibrate(8); return; }

  } catch (e) { }
}

/* ================= App + Themes ================= */

  font:800 18px/1 var(--round,ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif);color:var(--t1,#f5f5f7);font-variant-numeric:tabular-nums;transition:border-color .6s,background .6s,box-shadow .6s;will-change:transform}
.sf-pill .sf-fi{position:relative;width:19px;height:25px;flex:none;margin-top:-3px}
.sf-pill .sf-fi svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sf-pill b{display:inline-block;min-width:.6em;text-align:center}
.sf-pill[data-lv="-1"] b{color:var(--t2,rgba(235,235,245,.62))}
.sf-pill[data-lv="1"]{border-color:rgba(var(--f-glow),.28);box-shadow:0 0 10px rgba(var(--f-glow),.18)}
.sf-pill[data-lv="2"]{border-color:rgba(var(--f-glow),.42);box-shadow:0 0 16px rgba(var(--f-glow),.32)}
.sf-pill[data-lv="3"]{border-color:rgba(var(--f-glow),.6);background:color-mix(in srgb,rgb(var(--f-glow)) 10%,var(--s2,#1c1c1e));box-shadow:0 0 22px rgba(var(--f-glow),.5),inset 0 0 10px rgba(var(--f-glow),.15)}
.sf-pill[data-lv="4"]{border-color:rgba(var(--f-glow),.85);background:color-mix(in srgb,rgb(var(--f-glow)) 16%,var(--s2,#1c1c1e));animation:sf-maxglow 1.6s ease-in-out infinite}
@keyframes sf-maxglow{0%,100%{box-shadow:0 0 22px rgba(var(--f-glow),.6),inset 0 0 12px rgba(var(--f-glow),.25)}50%{box-shadow:0 0 34px rgba(var(--f-glow),.9),inset 0 0 16px rgba(var(--f-glow),.4)}}

.sf-big{position:relative;width:180px;height:234px;flex:none}
.sf-big svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sf-numbox{position:relative;width:240px;height:120px;margin-top:6px;display:grid;place-items:center;flex:none}

.sf-dorm .sf-num{color:#5c596c;text-shadow:0 7px 0 #2c2a36}
.sf-shard{position:absolute;inset:0;display:grid;place-items:center;will-change:transform,opacity}
.sf-crack{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sf-crack path{fill:none;stroke:#f4efff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.sf-title{font:800 30px/1.1 var(--round,ui-rounded,-apple-system,system-ui,sans-serif);margin-top:20px;letter-spacing:-.01em;text-align:center}
.sf-msg{font-size:16px;line-height:1.45;color:rgba(235,235,245,.66);text-align:center;margin-top:8px;max-width:30ch;min-height:2.9em}

.sf-emb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.sf-ring{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--f-inner);pointer-events:none;z-index:2}

/* ---------------------------- colours ---------------------------- */
// Keep ALL presets: purple is the default; the others are for special occasions later.
const PRESETS = {
  purple: ['#7451ee', '#a084ff', '#cdbdff', '#f4efff', '150,120,255'],
  ember:  ['#f2620f', '#ff9a1f', '#ffd04a', '#fff4cf', '255,140,40'],
  mint:   ['#0f9f8a', '#2fd4b0', '#9cf2dc', '#effffa', '60,220,180'],

/* ---------------------------- spring ---------------------------- */
class Spring { constructor(k, d, x = 0) { this.k = k; this.d = d; this.x = x; this.t = x; this.v = 0; }
  step(dt) { const n = Math.max(1, Math.ceil(dt / .006)), h = dt / n; for (let i = 0; i < n; i++) { const a = -this.k * (this.x - this.t) - this.d * this.v; this.v += a * h; this.x += this.v * h; } }
  kick(v) { this.v += v; } }

/* ------------------------- flame shape -------------------------
   Teardrop: round bottom, rounded tip. (cx,by)=bottom centre, w=width, h=height,
   lean=tip x offset, r=tip roundness. The flame = 4 layers of these, viewBox 0 0 100 130. */
function tear(cx, by, w, h, lean, r) {
  const hw = w / 2, tx = cx + lean, ty = by - h, wy = by - hw, up = wy - ty;
  return 'M' + r1(cx) + ' ' + r1(by) +
    'C' + r1(cx - hw * .56) + ' ' + r1(by) + ' ' + r1(cx - hw) + ' ' + r1(by - hw * .44) + ' ' + r1(cx - hw) + ' ' + r1(wy) +
    'C' + r1(cx - hw) + ' ' + r1(wy - up * .5) + ' ' + r1(tx - r) + ' ' + r1(ty + up * .06) + ' ' + r1(tx) + ' ' + r1(ty) +
    'C' + r1(tx + r) + ' ' + r1(ty + up * .06) + ' ' + r1(cx + hw) + ' ' + r1(wy - up * .5) + ' ' + r1(cx + hw) + ' ' + r1(wy) +
    'C' + r1(cx + hw) + ' ' + r1(by - hw * .44) + ' ' + r1(cx + hw * .56) + ' ' + r1(by) + ' ' + r1(cx) + ' ' + r1(by) + 'Z';
}

const FLAMES = new Set();
class Flame {

  body.querySelectorAll('.ring').forEach((s, i) => { const v = i ? (B.all.total ? B.all.done / B.all.total : 0) : (B.core.t ? B.core.pct : 0); setRing(s, 0); setTimeout(() => setRing(s, v), 120); });
}

/* ---------- feature tour (spotlight) ---------- */
const TOUR_V = 1;
function tourSteps() {
  return [
    { sel: '#v-today .sf-pill', t: 'Your streak', d: 'Grows every day you log at least one habit. Day 5 unlocks Platinum, day 10 Gold, day 20 the Crown. When the flame shakes, tap it.' },
    { sel: '#v-today [data-act=core]', alt: '#v-today [data-act=goStats]', t: 'Core habits ★', d: 'Star the habits that matter most: edit a habit → Core habit. This shows how many core habits you’ve done today, next to your total.' },
    { sel: '#v-today .sec[data-box]', alt: '#fab', t: 'To Do', d: 'One-time items live here until you finish them. Done ones move to Archive for 7 days. Add one with + → To Do, or drag one into Morning to do it then.' },
    { sel: '#v-today .sep.main', t: 'Separators', d: 'Tap the tiny + to add a separator. Hold one to drag it anywhere in its section. Tap it to rename it or pick a colour.' },
    { sel: '#v-today [data-act=todayMenu]', t: 'Sort Today', d: 'Switch Today between time of day and category in this menu.' },
    { sel: '#tabbar [data-v=stats]', t: 'Analytics', d: 'Yesterday’s core score sits at the top. Tap the rings for the details.' },
  ];
}
function startTour() {
  if ($('.tour')) return;
  if (App.view !== 'today') switchView('today');
  const steps = tourSteps(); let i = -1;
  const ov = el('<div class="tour"><div class="tour-block"></div><div class="tour-hole"></div><div class="tour-tip"><div class="tt-n"></div><div class="tt-t"></div><div class="tt-d"></div><div class="tt-b"><button class="tt-skip">Skip</button><button class="tt-next">Next</button></div></div></div>');
  document.body.appendChild(ov);
  const hole = ov.querySelector('.tour-hole'), tip = ov.querySelector('.tour-tip');
  const end = () => { App.state.settings.tourSeen = TOUR_V; save(); ov.classList.remove('show'); setTimeout(() => ov.remove(), 300); };
  const next = async () => {
    i++; let st = steps[i], target = null;
    while (st) { target = $(st.sel) || (st.alt && $(st.alt)); if (target && target.getClientRects().length) break; i++; st = steps[i]; }
    if (!st) { end(); return; }
    const vis = target.closest('.view'); if (vis) { const r0 = target.getBoundingClientRect(); if (r0.top < 90 || r0.bottom > innerHeight - 140) { target.scrollIntoView({ block: 'center', behavior: motionOK() ? 'smooth' : 'auto' }); await sleep(380); } }
    const r = target.getBoundingClientRect(), pad = 8;
    Object.assign(hole.style, { left: (r.left - pad) + 'px', top: (r.top - pad) + 'px', width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px' });
    tip.querySelector('.tt-n').textContent = (i + 1) + ' of ' + steps.length;
    tip.querySelector('.tt-t').textContent = st.t; tip.querySelector('.tt-d').textContent = st.d;
    tip.querySelector('.tt-next').textContent = i === steps.length - 1 ? 'Done' : 'Next';
    const below = r.bottom + 190 < innerHeight;
    tip.style.top = below ? (r.bottom + pad + 14) + 'px' : ''; tip.style.bottom = below ? '' : (innerHeight - r.top + pad + 14) + 'px';
    if (motionOK()) tip.animate([{ opacity: 0, transform: 'translateY(' + (below ? 8 : -8) + 'px)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.3,1.3,.5,1)' });
  };
  ov.querySelector('.tt-next').onclick = () => { haptic(); next(); };
  ov.querySelector('.tt-skip').onclick = end;
  raf(() => { ov.classList.add('show'); next(); });
}
function maybeTour() { const s = App.state.settings; if (!App.demo && s.welcomed && (s.tourSeen || 0) < TOUR_V && App.view === 'today' && !Sheets.stack.length) startTour(); }

</script>
